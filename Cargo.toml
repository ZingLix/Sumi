[package]
name = "sumi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A personal ledger service for AI clients"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
bigdecimal = "0.4"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
chrono-tz = "0.10"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rmcp = { version = "=1.7.0", features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1", "chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "bigdecimal", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
