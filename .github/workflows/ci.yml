name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sumi-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/check-repository.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16 curl
      - run: cargo test --test postgres --locked -- --ignored
        env:
          SUMI_TEST_ADMIN_URL: postgres://postgres:sumi-ci@127.0.0.1:5432/postgres
          SUMI_TEST_PG_BIN: /usr/lib/postgresql/16/bin
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.88.0'
      - run: cargo check --all-targets --locked
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUMI_DB_ADMIN_PASSWORD: sumi-ci
      SUMI_DB_APP_PASSWORD: sumi-ci
      SUMI_BASE_URL: http://127.0.0.1:8080/self-hosted/sumi
      SUMI_OAUTH_ISSUER: https://auth.sumi.test/
      SUMI_OAUTH_JWKS_HOST_FILE: ./tests/fixtures/jwks.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose up -d --build sumi
      - name: Verify prefixed public URL and OAuth discovery
        run: |
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/self-hosted/sumi/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:8080/self-hosted/sumi/mcp)" = 401
          curl --fail --silent http://127.0.0.1:8080/.well-known/oauth-protected-resource/self-hosted/sumi/mcp | python3 -c 'import json,sys; assert json.load(sys.stdin)["resource"] == "http://127.0.0.1:8080/self-hosted/sumi/mcp"'
      - name: Verify authenticated MCP writes and idempotency
        run: python3 scripts/smoke-deployment.py --state-file .local/deployment-smoke.json
      - name: Restart the stack with its existing database volume
        run: |
          docker compose down
          docker compose up -d sumi
      - name: Verify persisted ledger after restart
        run: python3 scripts/smoke-deployment.py --state-file .local/deployment-smoke.json --verify-only
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
